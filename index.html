<title>Careful Shopper — Mosquito Protection Guide</title>
<style>
:root{font-family:Verdana,Geneva,Arial,sans-serif;color:#14251C;background:#FBFAF6;line-height:1.65}

body{margin:0}
header{padding:18px max(20px,calc((100% - 1120px)/2));border-bottom:1px solid #DCE3DA}

.panel{margin:30px 0;padding:clamp(22px,4vw,36px);border:1px solid #DCE3DA;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(20,37,28,.05)}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:13px 20px;background:#075C37;color:#fff;border-radius:9px;font-weight:700;text-decoration:none}

</head>
