<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075C37">
<title>Careful Shopper</title>
<style>
:root{font-family:Verdana,Geneva,Arial,sans-serif;color:#14251C;background:#FBFAF6;line-height:1.65}
*{box-sizing:border-box}
body{margin:0}
header{padding:18px max(20px,calc((100% - 1120px)/2));border-bottom:1px solid #DCE3DA}
.brand{color:#075C37;font-size:1.15rem;font-weight:700;text-decoration:none;letter-spacing:.01em}
main{width:min(880px,calc(100% - 32px));margin:clamp(48px,9vw,104px) auto}
h1{font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.08;letter-spacing:-.03em;color:#075C37;margin:0 0 30px}
.panel{margin:20px 0;padding:clamp(22px,4vw,36px);border:1px solid #DCE3DA;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(20,37,28,.05);display:flex;align-items:center;justify-content:space-between;gap:20px}
.version{margin:0;color:#075C37;font-size:1.2rem;font-weight:700}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:13px 20px;background:#075C37;color:#fff;border-radius:9px;font-weight:700;text-decoration:none;white-space:nowrap}
.button:hover{background:#06472D}
a:focus-visible{outline:3px solid #B78B2E;outline-offset:3px}
@media(max-width:480px){.panel{align-items:stretch;flex-direction:column}.button{width:100%}}
</style>
</head>
<body>
<header><span class="brand">Careful Shopper</span></header>
<main>
<section aria-label="Versions">
<article class="panel">
<h1 class="version">Version 1.0.0</h1>
<a class="button" href="https://playground.wordpress.net/?blueprint-url=https%3A%2F%2Fraw.githubusercontent.com%2Ffrancis-h-francisco%2Fcareful-shopper-mosquito-guide%2Fmain%2Fblueprint.json" target="_blank" rel="noopener noreferrer">Open</a>
</article>
<article class="panel">
<h2 class="version">Version 2.0.0</h2>
<a class="button" href="https://playground.wordpress.net/?blueprint-url=https%3A%2F%2Fraw.githubusercontent.com%2Ffrancis-h-francisco%2Fcareful-shopper-mosquito-guide%2Fmain%2Fblueprint-v2.0.0.json" target="_blank" rel="noopener noreferrer">Open</a>
</article>
</section>
</main>
</body>
</html>
